<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>blip — Onboarding Chat</title>
<!--
  ONBOARDING CHAT — handoff spec for Claude Code
  ─────────────────────────────────────────────
  Flow (scripted here, deterministic — port to a real agent later):
  1. INTERESTS   blip asks for major categories → multi-select bubbles → confirm.
  2. PER-CATEGORY for each selected category, subcategory bubbles (multi-select)
                 + composer live for free-typing. A typed answer earns exactly ONE
                 follow-up question, then the flow moves to the next category.
  3. TUNE        3 follow-on questions (conditional on picks) → then a 20-story
                 budget card with ± steppers (total pinned to 20) → lock.
  4. YOUTUBE     ~30 channel tiles (thumbnail + name), sorted by relevance to the
                 persona, multi-select, in-chat.
  5. X CLUSTERS  10–15 curated handle clusters (name + handle count + samples),
                 multi-select, in-chat.
  6. YOUR 30     summary card: 20 stories · 7 YouTube · 3 X (defaults) + CTA.
  All history stays in the scrollback; answered steps collapse into user bubbles.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=3" />
<style>
  /* ─── chrome ─── */
  .ob-head{ position:absolute; top:59px; left:0; right:0; z-index:30; padding:10px 20px 12px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(to bottom, #020617 62%, transparent); pointer-events:none; }
  .ob-head .blip{ pointer-events:auto; }
  .ob-steps{ display:flex; align-items:center; gap:6px; pointer-events:auto; }
  .ob-step{ width:5px; height:5px; border-radius:9999px; background:rgba(255,255,255,.16); transition:background .3s, box-shadow .3s; }
  .ob-step.done{ background:rgba(255,255,255,.55); }
  .ob-step.now{ background:#FACC15; box-shadow:0 0 8px rgba(250,204,21,.8); }
  .ob-phase{ font-family:"JetBrains Mono",monospace; font-size:9px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.45); pointer-events:auto; }

  /* ─── chat scroll ─── */
  .chat{ position:absolute; inset:0; overflow-y:auto; scrollbar-width:none;
    padding:112px 16px 128px; box-sizing:border-box; }
  .chat::-webkit-scrollbar{ display:none; }
  .msgs{ display:flex; flex-direction:column; gap:10px; }

  /* ─── bubbles ─── */
  .row{ display:flex; flex-direction:column; gap:4px; max-width:88%; }
  .row.me{ align-self:flex-end; align-items:flex-end; }
  .row.bot{ align-self:flex-start; align-items:flex-start; }
  .who{ font-family:"JetBrains Mono",monospace; font-size:8.5px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.32); padding:0 6px; display:flex; align-items:center; gap:5px; }
  .who .dot{ width:5px; height:5px; border-radius:9999px; background:#FACC15; box-shadow:0 0 7px rgba(250,204,21,.85); }
  .bub{ font-family:"Inter"; font-size:14px; line-height:1.5; padding:11px 15px; border-radius:18px;
    animation:bubIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .bot .bub{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
    border-bottom-left-radius:5px; color:#e7e9ee; }
  .me .bub{ background:#fff; color:#06080f; font-weight:500; border-bottom-right-radius:5px; }
  .bub em{ font-style:normal; color:#FACC15; }
  .bub .k{ font-family:"JetBrains Mono",monospace; font-size:11px; }
  @keyframes bubIn{ from{ opacity:0; transform:translateY(10px) scale(.97); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .bub{ animation:none; } }

  /* typing indicator */
  .typing{ display:flex; gap:4px; padding:14px 16px; }
  .typing i{ width:5px; height:5px; border-radius:9999px; background:rgba(255,255,255,.45); animation:tp 1.1s ease-in-out infinite; }
  .typing i:nth-child(2){ animation-delay:.15s } .typing i:nth-child(3){ animation-delay:.3s }
  @keyframes tp{ 0%,60%,100%{ opacity:.3; transform:none } 30%{ opacity:1; transform:translateY(-3px) } }
  @media (prefers-reduced-motion: reduce){ .typing i{ animation:none; opacity:.6 } }

  /* ─── option bubbles (chips) ─── */
  .opts{ display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; max-width:100%; padding:2px 0 0;
    animation:bubIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .opt{ font-family:"Inter"; font-size:13px; font-weight:500; line-height:1; padding:11px 15px;
    border-radius:9999px; white-space:nowrap; cursor:pointer; border:1px solid rgba(255,255,255,.16);
    color:#d7dae2; background:rgba(255,255,255,.04); transition:background .16s,border-color .16s,color .16s,transform .14s; }
  .opt:active{ transform:scale(.94); }
  .opt.sel{ background:#fff; color:#020617; border-color:#fff; font-weight:600; }
  .opt.ghosted, .yt.ghosted, .cl.ghosted{ opacity:.35; pointer-events:none; }
  .opt .cd{ display:inline-block; width:6px; height:6px; border-radius:9999px; margin-right:7px; vertical-align:0.5px; }
  .opt.sel .cd{ box-shadow:none; }

  .confirm{ align-self:flex-start; margin-top:2px; display:flex; align-items:center; gap:10px;
    animation:bubIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .confirm button{ font-family:"Inter"; font-size:13px; font-weight:600; padding:12px 18px; border-radius:16px;
    background:#fff; color:#06080f; border:none; cursor:pointer; transition:transform .14s, opacity .2s; }
  .confirm button:active{ transform:scale(.96); }
  .confirm button:disabled{ opacity:.35; pointer-events:none; }
  .confirm .hint{ font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.12em;
    text-transform:uppercase; color:rgba(255,255,255,.35); }

  /* ─── allocation card ─── */
  .alloc{ width:100%; box-sizing:border-box; border:1px solid rgba(255,255,255,.12); border-radius:4px;
    background:rgba(255,255,255,.025); padding:14px 14px 12px; animation:bubIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .alloc .ttl{ font-family:"JetBrains Mono",monospace; font-size:9px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:11px; display:flex; justify-content:space-between; }
  .alloc .ttl b{ color:#fff; font-weight:600; }
  .alloc .ttl b.full{ color:#FACC15; }
  .arow{ display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid rgba(255,255,255,.06); }
  .arow .nm{ flex:1; font-family:"Inter"; font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:8px; }
  .arow .nm .cd{ width:6px; height:6px; border-radius:9999px; flex:none; }
  .arow .st{ display:flex; align-items:center; gap:2px; }
  .arow .st button{ width:30px; height:30px; border-radius:9999px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.04); color:#fff; font-size:15px; line-height:1; cursor:pointer; font-family:"Inter"; }
  .arow .st button:disabled{ opacity:.25; pointer-events:none; }
  .arow .st .n{ font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:600; width:26px; text-align:center; }
  .abar{ display:flex; gap:2.5px; margin-top:11px; }
  .abar i{ height:2.5px; flex:1; border-radius:9999px; background:rgba(255,255,255,.14); }
  .abar i.on{ background:rgba(255,255,255,.75); }

  /* ─── YouTube tiles ─── */
  .yt-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px 8px; width:100%;
    animation:bubIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .yt{ display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; padding:8px 2px 9px;
    background:transparent; border-radius:16px; border:1px solid transparent; transition:background .16s, border-color .16s, transform .14s; }
  .yt:active{ transform:scale(.95); }
  .yt.sel{ background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.22); }
  .yt .th{ width:58px; height:58px; border-radius:9999px; position:relative; flex:none;
    display:grid; place-items:center; border:1px solid rgba(255,255,255,.14);
    font-family:"JetBrains Mono",monospace; font-size:15px; font-weight:600; color:rgba(255,255,255,.9); }
  .yt .tick{ position:absolute; right:-3px; bottom:-3px; width:20px; height:20px; border-radius:9999px;
    background:#fff; color:#06080f; display:grid; place-items:center; opacity:0; transform:scale(.5);
    transition:opacity .16s, transform .16s; border:2px solid #020617; }
  .yt.sel .tick{ opacity:1; transform:none; }
  .yt .nm{ font-family:"Inter"; font-size:11px; font-weight:500; color:#d7dae2; text-align:center; line-height:1.3; }
  .yt.sel .nm{ color:#fff; }
  .yt .sub{ font-family:"JetBrains Mono",monospace; font-size:8px; letter-spacing:.08em; color:rgba(255,255,255,.35); text-transform:uppercase; }

  /* ─── X clusters ─── */
  .cl-wrap{ display:flex; flex-direction:column; gap:14px; width:100%;
    animation:bubIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .cl-sec{ display:flex; align-items:center; gap:10px; font-family:"JetBrains Mono",monospace; font-size:9px;
    font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.45); }
  .cl-sec .cd{ width:6px; height:6px; border-radius:9999px; flex:none; }
  .cl-sec::after{ content:""; flex:1; height:1px; background:rgba(255,255,255,.08); }
  .cl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
  .cl{ position:relative; display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:7px;
    border:1px solid rgba(255,255,255,.12); border-radius:4px; background:rgba(255,255,255,.025);
    padding:13px 13px 12px; cursor:pointer; color:#fff; font-family:"Inter";
    transition:background .16s, border-color .16s, transform .14s; }
  .cl:active{ transform:scale(.97); }
  .cl.sel{ background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.5); }
  .cl .tick{ position:absolute; top:9px; right:9px; width:20px; height:20px; border-radius:9999px;
    background:#fff; color:#06080f; display:grid; place-items:center; opacity:0; transform:scale(.5);
    transition:opacity .16s, transform .16s; }
  .cl.sel .tick{ opacity:1; transform:none; }
  .cl .cn{ font-size:12.5px; font-weight:600; line-height:1.25; padding-right:22px; }
  .cl .hl{ display:flex; flex-direction:column; gap:3px; }
  .cl .hl span{ font-family:"JetBrains Mono",monospace; font-size:9.5px; color:rgba(255,255,255,.62); }
  .cl.sel .hl span{ color:rgba(255,255,255,.8); }
  .cl .more{ font-family:"JetBrains Mono",monospace; font-size:8px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:rgba(255,255,255,.45); background:none; border:none; padding:4px 0;
    margin:-4px 0; cursor:pointer; text-align:left; transition:color .16s; }
  .cl .more:active{ color:#fff; }
  .cl .hl{ transition:none; }
  .cl .ds{ font-size:10.5px; line-height:1.45; color:rgba(255,255,255,.45); }
  .cl.sel .ds{ color:rgba(255,255,255,.6); }

  /* ─── final summary ─── */
  .plan{ width:100%; box-sizing:border-box; border:1px solid rgba(255,255,255,.12); border-radius:4px;
    background:rgba(255,255,255,.025); padding:16px 15px 15px; animation:bubIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .plan .ttl{ font-family:"JetBrains Mono",monospace; font-size:9px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:12px; }
  .pbar{ display:flex; gap:2px; margin-bottom:14px; }
  .pbar i{ height:3px; flex:1; border-radius:9999px; }
  .prow{ display:flex; align-items:baseline; gap:12px; padding:9px 0; border-top:1px solid rgba(255,255,255,.06); }
  .prow .num{ font-family:"Playfair Display",serif; font-weight:700; font-size:26px; line-height:1; width:38px; flex:none; text-align:right; }
  .prow .lb{ flex:1; }
  .prow .lb b{ font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; display:block; }
  .prow .lb span{ font-family:"Inter"; font-size:11.5px; color:rgba(255,255,255,.5); }
  .plan .cta{ width:100%; margin-top:13px; padding:15px; border-radius:16px; border:none; background:#fff;
    color:#06080f; font-family:"Inter"; font-size:14px; font-weight:600; cursor:pointer; transition:transform .14s; }
  .plan .cta:active{ transform:scale(.97); }

  /* ─── composer ─── */
  .composer{ position:absolute; left:0; right:0; bottom:0; z-index:40; padding:12px 14px 42px;
    background:linear-gradient(to top, #020617 58%, transparent); display:flex; gap:9px; align-items:center; }
  .cfield{ flex:1; display:flex; align-items:center; height:52px; border-radius:15px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.22); padding:0 6px 0 16px;
    transition:opacity .3s, border-color .2s; }
  .cfield input{ flex:1; background:none; border:none; outline:none; color:#fff;
    font-family:"Inter"; font-size:14px; min-width:0; }
  .cfield input::placeholder{ color:rgba(255,255,255,.32); }
  .cfield .send{ width:38px; height:38px; border-radius:11px; border:none; background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.4); display:grid; place-items:center; cursor:pointer; flex:none;
    transition:background .16s, color .16s, transform .14s; }
  .cfield .send.live{ background:#fff; color:#06080f; }
  .cfield .send:active{ transform:scale(.9); }
  .composer.idle .cfield{ opacity:.45; }
  .chint{ position:absolute; left:0; right:0; bottom:26px; text-align:center; font-family:"JetBrains Mono",monospace;
    font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.28); pointer-events:none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="device" id="device" style="--accent:#22D3EE">
      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <span class="sb-right">
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"></rect><rect x="4.5" y="5" width="3" height="7" rx="1" fill="#fff"></rect><rect x="9" y="2.5" width="3" height="9.5" rx="1" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity="0.4"></rect></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5C5.5 2.5 3.3 3.5 1.7 5.1l1.1 1.1C4.1 4.9 5.9 4 8 4s3.9.9 5.2 2.2l1.1-1.1C12.7 3.5 10.5 2.5 8 2.5Z" fill="#fff"></path><circle cx="8" cy="10" r="1.4" fill="#fff"></circle></svg>
            <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="21" height="12" rx="3" fill="none" stroke="#fff" opacity="0.5"></rect><rect x="2" y="2" width="16" height="9" rx="1.5" fill="#fff"></rect><rect x="23" y="4" width="2" height="5" rx="1" fill="#fff" opacity="0.5"></rect></svg>
          </span>
        </div>
        <div class="ambient" style="opacity:.22"></div>

        <div class="ob-head">
          <span class="blip mono" style="font-size:19px">bl<span class="bi">ı<i class="tittle"><b class="bdot"></b><svg class="blip-sig" viewBox="0 0 11 14" fill="none"><path class="bw bw1" d="M2.22 4.70 A3.2 3.2 0 0 1 2.22 9.30"></path><path class="bw bw2" d="M4.31 2.54 A6.2 6.2 0 0 1 4.31 11.46"></path><path class="bw bw3" d="M6.39 0.39 A9.2 9.2 0 0 1 6.39 13.61"></path></svg></i></span>p</span>
          <span class="ob-phase" id="phaseLabel">INTERESTS</span>
          <span class="ob-steps" id="stepDots"></span>
        </div>

        <div class="chat" id="chat" data-screen-label="Onboarding chat">
          <div class="msgs" id="msgs"></div>
        </div>

        <div class="composer idle" id="composer">
          <div class="cfield">
            <input id="cin" type="text" autocomplete="off" placeholder="Pick from the bubbles above" />
            <button class="send" id="csend" aria-label="Send">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
            </button>
          </div>
        </div>
        <div class="chint" id="chint"></div>

        <div class="island"></div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
<script src="onboarding-chat.js"></script>
</body>
</html>
